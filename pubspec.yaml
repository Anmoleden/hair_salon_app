name: hair_salon
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^5.0.7
  google_fonts: ^6.2.1
  permission_handler: ^12.0.0
  # face_camera: ^0.1.4
  image_picker: ^0.8.7
  path: ^1.9.1
  path_provider: ^2.0.11
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_commons: ^0.11.0
  camera: ^0.11.1
  image_cropper: ^9.1.0
  dotted_border: ^2.1.0
  shimmer: ^2.0.0
  percent_indicator: ^4.2.2 
  intl: ^0.18.0
  screenshot: ^3.0.0
  image: ^4.0.17
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hairstyle.png
    - assets/Instruct-image.png
    - assets/face_classification_model/face_shape_classifier.tflite
    
    - assets/hairs/short1.png
    - assets/hairs/short2.png
    - assets/hairs/long1.png
    - assets/hairs/long2.png
    - assets/hairs/med1.png
    - assets/hairs/med2.png
    - assets/hairs/f_short1.png
    - assets/hairs/f_med1.png
    - assets/hairs/f_long1.png
    - assets/hairs/f_long2.png
    - assets/glasses/glass1.png
    - assets/glasses/glass2.png

    